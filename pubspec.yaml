name: chenge_world_app
description: ChengeWorld community client for Android.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ">=3.7.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  flutter_secure_storage: ^9.2.4
  flutter_markdown: ^0.7.7
  http: ^1.5.0
  url_launcher: ^6.3.2
  shared_preferences: ^2.5.3
  dynamic_color: ^1.7.0
  webview_flutter: ^4.10.0
  flutter_staggered_grid_view: ^0.7.0
  # 图片磁盘+内存缓存
  cached_network_image: ^3.4.1
  flutter_cache_manager: ^3.4.5
  # 实时聊天 WebSocket
  web_socket_channel: ^3.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/images/logo.png
