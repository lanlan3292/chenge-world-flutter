name: Flutter CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-26.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze Dart code
        run: flutter analyze

      - name: Run tests
        run: flutter test

  build-android:
    needs: test
    runs-on: ubuntu-26.04

    steps:

      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get
    
      - name: Build APK
        run: flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: chenge-world-apk
          path: build/app/outputs/apk/debug/app-debug.apk
          retention-days: 3

  build-windows:
    needs: test
    runs-on: windows-latest

    steps:

      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows executable
        run: flutter build windows --release

      - name: Package as zip
        run: |
          Compress-Archive -Path "build\windows\x64\runner\Release\*" `
            -DestinationPath "chenge-world-windows.zip"

      - name: Upload Windows zip
        uses: actions/upload-artifact@v7
        with:
          name: chenge-world-windows-zip
          path: chenge-world-windows.zip
          retention-days: 2

  build-linux:
    needs: test
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang \
            cmake \
            ninja-build \
            pkg-config \
            libgtk-3-dev \
            liblzma-dev \
            libsecret-1-dev

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Linux
        run: flutter build linux --debug

      - name: Package Linux
        run: |
          tar -czf chenge-world-linux-debug.tar.gz \
            -C build/linux/x64/debug bundle

      - name: Upload Linux
        uses: actions/upload-artifact@v7
        with:
          name: chenge-world-linux-debug
          path: chenge-world-linux-debug.tar.gz
          retention-days: 2

  build-ios:
    needs: test
    runs-on: macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build iOS
        run: flutter build ios --debug --no-codesign

      - name: Package iOS app
        run: |
          mkdir -p ios-build
          cp -R build/ios/iphoneos/Runner.app ios-build/

      - name: Upload iOS
        uses: actions/upload-artifact@v7
        with:
          name: chenge-world-ios-debug
          path: ios-build
          retention-days: 2
